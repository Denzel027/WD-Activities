    <script>

        (function () {
            var loader = document.getElementById("loader");
            var audio = document.getElementById("loaderAudio");
            var lights = loader.querySelectorAll(".gantry span");

            var RATE = 1.5;
            var LOGO_MS = 1200;
            var BEEPS = [0.68, 1.68, 2.68, 3.69, 4.69];
            var SYNC_LEAD = 0.03;
            var END_AT = 5.1;

            var run = 0, pageReady = document.readyState === "complete";
            if (!pageReady) {
                window.addEventListener("load", function () { pageReady = true; });
                setTimeout(function () { pageReady = true; }, 6000);
            }

            audio.volume = 0.6;
            document.body.classList.add("is-loading");

            function finish() {
                loader.classList.add("hide");
                document.body.classList.remove("is-loading");
                audio.pause();
            }


            function lightsPhase(my, silent) {
                var t0 = performance.now(), shown = 0;
                loader.classList.add("running");
                function now() { return silent ? (performance.now() - t0) / 1000 * RATE : audio.currentTime; }
                (function tick() {
                    if (my !== run) return;
                    var t = now();
                    while (shown < BEEPS.length && t >= BEEPS[shown] - SYNC_LEAD) {
                        lights[shown++].classList.add("on");
                    }
                    if (t >= END_AT && pageReady) { finish(); return; }
                    requestAnimationFrame(tick);
                })();
            }

            function sequence() {
                var my = ++run;
                loader.classList.remove("hide", "play", "stage-in", "running");
                lights.forEach(function (l) { l.classList.remove("on"); });
                void loader.offsetWidth;
                document.body.classList.add("is-loading");
                loader.classList.add("play");

                setTimeout(function () {
                    if (my !== run) return;
                    loader.classList.add("stage-in");
                    audio.currentTime = 0;
                    audio.playbackRate = RATE;
                    var p = audio.play();
                    if (p && p.then) {
                        p.then(function () { if (my === run) lightsPhase(my, false); },
                            function () { if (my === run) lightsPhase(my, true); });
                    } else { lightsPhase(my, false); }
                }, LOGO_MS);
            }

            sequence();


            document.getElementById("replayLogo").addEventListener("click", function (e) {
                e.preventDefault();
                window.scrollTo({ top: 0 });
                sequence();
            });
        })();
    </script>

    <script>

        (function () {
            var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            // Scroll progress bar + back-to-top
            var bar = document.getElementById("progress");
            var toTop = document.getElementById("toTop");
            function onScroll() {
                var max = document.documentElement.scrollHeight - window.innerHeight;
                bar.style.transform = "scaleX(" + (max > 0 ? window.scrollY / max : 0) + ")";
                toTop.classList.toggle("show", window.scrollY > 600);
            }
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();
            toTop.addEventListener("click", function () { window.scrollTo({ top: 0 }); });

            // Scroll reveal
            var items = document.querySelectorAll(".reveal");
            if ("IntersectionObserver" in window && !reduce) {
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (en) {
                        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
                    });
                }, { threshold: 0.12 });
                items.forEach(function (el) { io.observe(el); });
            } else {
                items.forEach(function (el) { el.classList.add("in"); });
            }
        })();
    </script>
