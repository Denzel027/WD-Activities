<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Podium</title>

    <link rel="icon" type="image/png" href="\F1-Showroom\img\f1.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/index.css">
</head>

<body>
    <div class="container-fluid min-vh-100"> <!--Main Container for all-->
        <div class="row"> <!--Static Navbar-->
            <div class="col">
                <div class="d-flex justify-content-between align-items-center bg-transparent border-0 px-3">
                    <div>
                        <img src="\F1-Showroom\img\f1.png" class="img1">
                    </div>
                    <div>
                        <img src="\F1-Showroom\img\fia.png" class="img2">
                    </div>
                </div>
            </div>
        </div>

        <div class="row"> <!--Second Heading-->
            <div class="col text-center">
                <div class="d-flex justify-content-center align-items-center  gap-3"><p class="font-l barlow main-red">Grand Prix</p>
                <p class="font-l barlow main-yellow">Winners</p>
                <p class="font-l barlow main-white">Gallery</p>
                </div>
                
                <p class="font-sm roboto main-white">One bay for every 2026 grand prix winner of the season, each parked beside the car that took the flag.</p>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col d-flex align-items-center justify-content-center">
                <div class="card border-0 mercedes rounded-3">
                    <div class="card-body"><div class="card-title d-flex align-items-center text-start">
                        <img src="\F1-Showroom\img\aust.png">
                        <p class="sm main-white">Australia GP</p>
                    </div></div>
                    
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>

</html>
